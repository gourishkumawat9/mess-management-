# Local PostgreSQL for development: `docker compose up -d`
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mess
      POSTGRES_PASSWORD: mess
      POSTGRES_DB: mess
    ports:
      - "5432:5432"
    volumes:
      - mess-db:/var/lib/postgresql/data

volumes:
  mess-db:
